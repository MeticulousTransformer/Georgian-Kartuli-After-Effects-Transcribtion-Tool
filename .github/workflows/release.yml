name: Test and release CapForge

on:
  push:
    branches: [kml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: capforge-release-kml
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  CAPFORGE_RELEASE_TAG: build-${{ github.sha }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare test dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Check all components
        run: python scripts/check_release.py

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build shared payload and standalone EXE
        run: |
          python scripts/package_release.py --source-only
          python scripts/build_windows.py --archive dist/CapForge-0.3.3.zip
          python scripts/package_update.py --archive dist/CapForge-0.3.3.zip --native dist/CapForge-0.3.3-Windows.exe --platform windows --output dist/public/CapForge-0.3.3-Windows.zip
          Copy-Item dist/CapForge-0.3.3-Windows.exe* dist/public/
      - name: Install the exact EXE on a fresh Windows destination
        run: python scripts/check_native_install.py --platform windows --installer dist/public/CapForge-0.3.3-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: capforge-windows
          path: dist/public/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare Apple signing credentials
        id: signing
        env:
          CAPFORGE_APPLE_CERTIFICATE_P12: ${{ secrets.CAPFORGE_APPLE_CERTIFICATE_P12 }}
          CAPFORGE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CAPFORGE_APPLE_CERTIFICATE_PASSWORD }}
          CAPFORGE_APPLE_ID: ${{ secrets.CAPFORGE_APPLE_ID }}
          CAPFORGE_APPLE_APP_PASSWORD: ${{ secrets.CAPFORGE_APPLE_APP_PASSWORD }}
          CAPFORGE_APPLE_TEAM_ID: ${{ secrets.CAPFORGE_APPLE_TEAM_ID }}
        run: bash scripts/prepare_macos_signing.sh
      - name: Build and verify universal app, DMG and updates
        id: package
        env:
          APPLE_SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          python scripts/package_release.py --source-only
          signing_args=()
          if [[ "$APPLE_SIGNING_CONFIGURED" == true ]]; then
            signing_args=(--sign-identity "$CAPFORGE_MACOS_SIGNING_IDENTITY" --sign-keychain "$CAPFORGE_SIGNING_KEYCHAIN" --notary-profile CapForgeNotary --notary-keychain "$CAPFORGE_SIGNING_KEYCHAIN")
          fi
          python scripts/build_macos.py --archive dist/CapForge-0.3.3.zip "${signing_args[@]}"
          python scripts/package_update.py --archive dist/CapForge-0.3.3.zip --native dist/CapForge.app --platform macos --output dist/public/CapForge-0.3.3-macOS.zip
          python scripts/package_update.py --archive dist/CapForge-0.3.3.zip --native dist/CapForge.app --platform macos --legacy --output dist/public/CapForge-0.3.3.zip
          cp dist/CapForge-0.3.3-macOS.dmg* dist/public/
          echo "notarized=$APPLE_SIGNING_CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/capforge-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - name: Keep Apple submission diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-notarization-diagnostics
          path: dist/notarization/*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: capforge-macos
          path: dist/public/*
          if-no-files-found: error

  verify_macos:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: capforge-macos
          path: dist
      - name: Verify disk image and install its app
        env:
          APPLE_NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          cd dist
          shasum -a 256 -c CapForge-0.3.3-macOS.dmg.sha256
          cd ..
          mount="$RUNNER_TEMP/CapForge mounted"
          mkdir -p "$mount"
          hdiutil attach dist/CapForge-0.3.3-macOS.dmg -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/CapForge.app"
          if [[ "$APPLE_NOTARIZED" == true ]]; then
            python scripts/check_notarized_updates.py --macos-archive dist/CapForge-0.3.3-macOS.zip --legacy-archive dist/CapForge-0.3.3.zip
            PYTHONPATH=scripts python -c 'import sys; from pathlib import Path; from notarize_macos import verify_distribution; verify_distribution(Path(sys.argv[1]), Path(sys.argv[2]))' "$mount/CapForge.app" dist/CapForge-0.3.3-macOS.dmg
          fi
          python scripts/check_native_install.py --platform macos --installer "$mount/CapForge.app/Contents/MacOS/CapForge"

  release:
    needs: [windows, macos, verify_macos]
    if: github.ref == 'refs/heads/kml' && needs.macos.outputs.notarized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: capforge-*
          merge-multiple: true
          path: dist
      - name: Publish both native installers together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_commit=$(gh api "repos/$GH_REPO/commits/kml" --jq .sha)
          test "$latest_commit" = "$GITHUB_SHA" || exit 1
          if gh release view "$CAPFORGE_RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Choose your computer

          - **Mac:** download `CapForge-0.3.3-macOS.dmg`, open it, drag CapForge to Applications, and open CapForge. [Mac guide](https://github.com/MeticulousTransformer/CapForge/blob/kml/docs/INSTALL_MAC.md).
          - **Windows:** download and open `CapForge-0.3.3-Windows.exe`. No ZIP extraction. [Windows guide](https://github.com/MeticulousTransformer/CapForge/blob/kml/docs/INSTALL_WINDOWS.md).

          Both installers share this exact commit and version. First setup needs internet; Python and audio support are prepared privately. Save your AE project and close AE before installation.

          The GitHub repository is now **MeticulousTransformer/CapForge**. If you downloaded an installer before this rename, download the current DMG or EXE once so its updater uses the new address. Your keys and exports are preserved. [Update guide](https://github.com/MeticulousTransformer/CapForge/blob/kml/docs/UPDATES.md).

          The Mac app and DMG are Developer ID signed and Apple notarized, with approval tickets included in the DMG and update downloads. macOS can still show its normal first-open confirmation. This approval covers the native app and disk image; the separately downloaded Python and FFmpeg runtime is outside that notarization submission. Windows publisher signing and Adobe extension signing remain pending; see your OS guide.

          Packaged installation passed on Windows, Apple Silicon and Intel Mac. Real AE compatibility and paid transcription should be checked on your own clips.

          The ZIP assets and their checksums support automatic updates and the older installer entry point; new users should choose the DMG or EXE above.
          NOTES
          gh release create "$CAPFORGE_RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "CapForge 0.3.3 · Mac & Windows · ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest

  website:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Publish download website
        id: deployment
        uses: actions/deploy-pages@v4
